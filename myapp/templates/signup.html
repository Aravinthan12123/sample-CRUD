{% extends 'base.html' %}

{% block content %}

<style>

.register-container{
    display:flex;
    justify-content:center;
    padding:50px 20px;
}

.register-box{
    width:100%;
    max-width:550px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    padding:45px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.register-box h2{
    text-align:center;
    color:#4e54c8;
    margin-bottom:35px;
    font-size:32px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#444;
}

.form-group input{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

.form-group input:focus{
    border-color:#4e54c8;
    box-shadow:0 0 10px rgba(78,84,200,.2);
}

.checkbox-group{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:20px;
}

.checkbox-group input{
    width:auto;
}

.checkbox-group label{
    margin:0;
    font-weight:500;
}

.submit-btn{
    width:100%;
    padding:15px;
    margin-top:25px;
    border:none;
    border-radius:12px;
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-3px);
}

.messages{
    margin-bottom:25px;
}

.messages .success{
    background:#d4edda;
    color:#155724;
    padding:15px;
    border-radius:10px;
}

.messages .error{
    background:#ffe5e5;
    color:#c62828;
    padding:15px;
    border-radius:10px;
}

.login-link{
    text-align:center;
    margin-top:25px;
}

.login-link a{
    color:#4e54c8;
    text-decoration:none;
    font-weight:600;
}

.login-link a:hover{
    text-decoration:underline;
}

@media(max-width:768px){

    .register-box{
        padding:30px 25px;
    }

    .register-box h2{
        font-size:26px;
    }

}

</style>


<div class="register-container">

    <div class="register-box">

        <h2>Create Account</h2>

        <!-- Messages -->
        <div class="messages">

            {% if messages %}
                {% for message in messages %}
                    <div class="{{ message.tags }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

        </div>


        <form method="POST">

            {% csrf_token %}

            <div class="form-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    id="username"
                    placeholder="Enter username"
                    required>

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    id="email"
                    placeholder="Enter email address"
                    required>

            </div>


            <div class="form-group">

                <label for="password1">
                    Password
                </label>

                <input
                    type="password"
                    name="password1"
                    id="password1"
                    placeholder="Enter password"
                    required>

            </div>


            <div class="form-group">

                <label for="password2">
                    Confirm Password
                </label>

                <input
                    type="password"
                    name="password2"
                    id="password2"
                    placeholder="Confirm password"
                    required>

            </div>


            <div class="checkbox-group">

                <input
                    type="checkbox"
                    name="agree"
                    id="agree"
                    required>

                <label for="agree">
                    I agree to the terms & conditions
                </label>

            </div>


            <button class="submit-btn" type="submit">

                Create Account

            </button>

        </form>


        <div class="login-link">

            Already have an account?

            <a href="{% url 'login' %}">
                Login Here
            </a>

        </div>

    </div>

</div>

{% endblock %}
