<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>
        /* Reset */
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            background:linear-gradient(135deg,#4e54c8,#8f94fb);
        }

        /* Header */
        header{
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(15px);
            color:#fff;
            padding:20px;
            text-align:center;
            box-shadow:0 4px 15px rgba(0,0,0,.1);
        }

        header h1{
            font-size:32px;
            margin-bottom:8px;
        }

        header p{
            opacity:.9;
        }

        /* Main */
        main{
            flex:1;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        /* Login Box */
        .login-box{
            width:100%;
            max-width:400px;
            padding:40px;
            border-radius:20px;
            background:rgba(255,255,255,.15);
            backdrop-filter:blur(20px);
            border:1px solid rgba(255,255,255,.2);
            box-shadow:0 10px 30px rgba(0,0,0,.2);
            color:white;
        }

        .login-box h2{
            text-align:center;
            margin-bottom:30px;
            font-size:30px;
            font-weight:600;
        }

        /* Messages */
        .messages{
            margin-bottom:20px;
        }

        .messages .error{
            background:#ffe5e5;
            color:#c62828;
            padding:12px;
            border-radius:10px;
            margin-bottom:10px;
        }

        .messages .success{
            background:#d4edda;
            color:#155724;
            padding:12px;
            border-radius:10px;
            margin-bottom:10px;
        }

        /* Form */
        .form-group{
            margin-bottom:20px;
        }

        .form-group label{
            display:block;
            margin-bottom:8px;
            font-weight:500;
        }

        .form-group input{
            width:100%;
            padding:14px;
            border:none;
            outline:none;
            border-radius:10px;
            background:rgba(255,255,255,.2);
            color:white;
            font-size:15px;
            transition:.3s;
        }

        .form-group input::placeholder{
            color:#eaeaea;
        }

        .form-group input:focus{
            background:rgba(255,255,255,.3);
            border:1px solid rgba(255,255,255,.5);
        }

        /* Button */
        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#fff;
            color:#4e54c8;
            font-size:16px;
            font-weight:600;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            transform:translateY(-2px);
            background:#f5f5f5;
        }

        /* Register Link */
        .register-link{
            text-align:center;
            margin-top:20px;
        }

        .register-link p{
            color:white;
        }

        .register-link a{
            color:#fff;
            font-weight:600;
            text-decoration:none;
        }

        .register-link a:hover{
            text-decoration:underline;
        }

        /* Footer */
        footer{
            background:rgba(0,0,0,.2);
            color:white;
            text-align:center;
            padding:15px;
        }

        /* Responsive */
        @media(max-width:576px){

            header h1{
                font-size:24px;
            }

            .login-box{
                padding:30px 25px;
            }

            .login-box h2{
                font-size:24px;
            }

        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <h1>Welcome to Our Website</h1>
        <p>A simple sample index page</p>
    </header>

    <!-- Main Content -->
    <main>

        <div class="login-box">

            <h2>Login</h2>

            <!-- Django Messages -->
            <div class="messages">
                {% if messages %}
                    {% for message in messages %}
                        <div class="{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            </div>

            <!-- Login Form -->
            <form method="POST">

                {% csrf_token %}

                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        name="username"
                        id="username"
                        placeholder="Enter your username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <!-- Register Link -->
            <div class="register-link">
                <p>
                    Don't have an account?
                    <a href="{% url 'signup' %}">
                        Register here
                    </a>
                </p>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer>
        <p>&copy; 2025 My Website | All Rights Reserved</p>
    </footer>

</body>
</html>
