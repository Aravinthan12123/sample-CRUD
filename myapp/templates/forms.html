{% extends 'base.html' %}

{% block content %}

<style>

.form-container{
    display:flex;
    justify-content:center;
    padding:50px 20px;
}

.form-box{
    width:100%;
    max-width:650px;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(20px);
    padding:45px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,.1);
}

.form-box h2{
    text-align:center;
    color:#4e54c8;
    margin-bottom:35px;
    font-size:32px;
}

.form-group{
    margin-bottom:20px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
    color:#444;
}

.form-group input,
.form-group select,
.form-group textarea{
    width:100%;
    padding:14px;
    border:1px solid #ddd;
    border-radius:12px;
    outline:none;
    font-size:15px;
    transition:.3s;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus{
    border-color:#4e54c8;
    box-shadow:0 0 10px rgba(78,84,200,.2);
}

.form-group textarea{
    resize:none;
    height:100px;
}

.checkbox-group{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:20px;
}

.checkbox-group input{
    width:auto;
}

.checkbox-group label{
    margin:0;
    font-weight:500;
}

.submit-btn{
    width:100%;
    border:none;
    padding:15px;
    margin-top:25px;
    border-radius:12px;
    background:linear-gradient(135deg,#4e54c8,#8f94fb);
    color:white;
    font-size:16px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

.submit-btn:hover{
    transform:translateY(-3px);
}

.messages{
    margin-top:20px;
}

.messages .success{
    background:#d4edda;
    color:#155724;
    padding:15px;
    border-radius:10px;
}

.messages .error{
    background:#ffe5e5;
    color:#c62828;
    padding:15px;
    border-radius:10px;
}

@media(max-width:768px){

    .form-box{
        padding:30px 25px;
    }

    .form-box h2{
        font-size:26px;
    }

}

</style>


<div class="form-container">

    <div class="form-box">

        <h2>General Form</h2>

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="name">Full Name</label>
                <input
                    type="text"
                    id="name"
                    name="full_name"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input
                    type="date"
                    id="dob"
                    name="dob"
                    required>
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>

                <select id="gender" name="gender" required>
                    <option value="">-- Select --</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

            </div>

            <div class="form-group">
                <label for="message">Message / Notes</label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Type here..."></textarea>

            </div>

            <div class="checkbox-group">

                <input
                    type="checkbox"
                    id="agree"
                    name="agree"
                    required>

                <label for="agree">
                    I agree to the terms & conditions
                </label>

            </div>

            <button class="submit-btn" type="submit">
                Submit
            </button>

            <div class="messages">

                {% if messages %}
                    {% for message in messages %}
                        <div class="{{ message.tags }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

            </div>

        </form>

    </div>

</div>

{% endblock %}
